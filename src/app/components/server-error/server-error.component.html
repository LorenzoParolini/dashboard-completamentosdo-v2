<div class="server-error-container">
  <div class="error-content">
    <div class="error-image">
      <img src="/assets/500-error.png" alt="Errore Server" class="error-img">
    </div>
    
    <div class="error-text">
      <h2 class="error-title">Oops! Qualcosa è andato storto</h2>
      <p class="error-description">
        Non riusciamo a connetterci al server. Verifica la tua connessione internet
        o prova di nuovo più tardi.
      </p>
      <!-- <p class="error-message">{{ errorMessage }}</p> -->
    </div>
    
    <div class="error-actions">
      <button 
        class="retry-button" 
        (click)="onRetry()"
        type="button"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        Riprova
      </button>
    </div>
  </div>
</div>
