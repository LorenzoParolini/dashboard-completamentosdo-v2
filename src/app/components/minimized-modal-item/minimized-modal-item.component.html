<div class="minimized-modal" [attr.data-type]="modal.type" (click)="onRestore()">
  <div class="modal-header-mini">
    <span class="type-indicator">{{ getTypeLabel() }}</span>
    <span class="section-label">{{ getSectionLabel() }}</span>
  </div>
  <div class="modal-description" [title]="modal.description">
    {{ modal.description }}
  </div>
  <button 
    class="close-btn" 
    (click)="onClose(); $event.stopPropagation()" 
    aria-label="Chiudi definitivamente"
    [title]="'Chiudi ' + modal.description">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
