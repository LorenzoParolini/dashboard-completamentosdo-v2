<div class="regioni-container">
  <h2 class="regioni-title">Regioni</h2>
  <div class="regioni-table-wrapper" [hidden]="loading">
    <table class="regioni-table" >
      <thead>
        <tr class="regioni-thead-row">
          <th class="regioni-th">ID</th>
          <th class="regioni-th">Descrizione</th>
          <th class="regioni-th">Codice</th>
          <th class="regioni-th">Coordinate</th>
          <th class="add-button"><button>Aggiungi</button></th>
        </tr>
      </thead>
      <tbody>
        <tr class="regioni-tbody-row" *ngFor="let regione of regioni">
          <td class="regioni-td">{{ regione.id }}</td>
          <td class="regioni-td">{{ regione.descrizione }}</td>
          <td class="regioni-td">{{ regione.codice }}</td>
          <td class="regioni-td">{{ regione.coordinate?.x }}, {{ regione.coordinate?.y }}</td>
          <td class="regioni-td UD-buttons">
            <button class="update-button">Modifica</button>
            <button class="delete-button" (click)="onDeleteRegione(regione.id)">Elimina</button>
          </td>
        </tr>
      </tbody>
    </table>
    
  </div>
  <div class="loading-spinner" *ngIf="loading">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect fill="#130CFF" stroke="#130CFF" stroke-width="15" width="30" height="30" x="25" y="50"><animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;" keySplines=".5 0 .5 1;.5 0 .5 1" repeatCount="indefinite" begin="-.4"></animate></rect><rect fill="#130CFF" stroke="#130CFF" stroke-width="15" width="30" height="30" x="85" y="50"><animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;" keySplines=".5 0 .5 1;.5 0 .5 1" repeatCount="indefinite" begin="-.2"></animate></rect><rect fill="#130CFF" stroke="#130CFF" stroke-width="15" width="30" height="30" x="145" y="50"><animate attributeName="y" calcMode="spline" dur="2" values="50;120;50;" keySplines=".5 0 .5 1;.5 0 .5 1" repeatCount="indefinite" begin="0"></animate></rect></svg>
    </div>
