<div class="page-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          Gestione Regioni
        </h1>
        <p class="page-subtitle">Visualizza e gestisci tutte le regioni del sistema</p>
      </div>
      <div class="header-actions">
        <button 
          (click)="onRefresh()" 
          class="refresh-button icon-button"
          [disabled]="loading">
          <div class="icon-container">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.fa-spin]="loading">
              <polyline points="23,4 23,10 17,10"></polyline>
              <polyline points="1,20 1,14 7,14"></polyline>
              <path d="M20.49,9A9,9,0,0,0,5.64,5.64L1,10m22,4L18.36,18.36A9,9,0,0,1,3.51,15"></path>
            </svg>
          </div>
          <div class="text-container">
            <span>Aggiorna</span>
          </div>
        </button>
        
        <button class="add-button icon-button" (click)="openRegioneModal()">
          <div class="icon-container">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <div class="text-container">
            <span>Aggiungi</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Content Section -->
  <div class="page-content">
    <div *ngIf="error && !loading" class="alert alert-danger alert-dismissible fade show">
      <svg width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16">
        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
      </svg>
      {{ error }}
      <button type="button" class="btn-close" (click)="error = null"></button>
    </div>

    <ng-container *ngIf="!loading; else loadingBlock">
      <div class="data-table-container" *ngIf="filteredRegioni.length > 0; else noDataBlock">
        <div class="table-wrapper">
          <table class="data-table">
            <thead class="table-header">
              <tr>
                <th class="table-th"></th>
                <th class="table-th">Descrizione</th>
                <th class="table-th">Codice</th>
                <th class="table-th">Coordinate</th>
                <th class="table-th actions-column">Azioni</th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr class="table-row" *ngFor="let regione of filteredRegioni; trackBy: trackByRegioneId">
                <td class="table-td id-column">{{ regione.id }}</td>
                <td class="table-td">{{ regione.descrizione }}</td>
                <td class="table-td">
                  <span class="code-badge">{{ regione.codice }}</span>
                </td>
                <td class="table-td">
                  <div class="coordinates" *ngIf="regione.coordinate">
                    <span class="coordinate-value">{{ regione.coordinate.x | number:'1.2-2' }}</span>
                    <span class="coordinate-separator">,</span>
                    <span class="coordinate-value">{{ regione.coordinate.y | number:'1.2-2' }}</span>
                  </div>
                  <span class="no-data" *ngIf="!regione.coordinate">N/A</span>
                </td>
                <td class="table-td actions-column">
                  <div class="action-buttons">
                    <button class="action-button edit-button icon-button" (click)="openRegioneModal(regione)">
                      <div class="icon-container">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                      </div>
                      <div class="text-container">
                        <span>Modifica</span>
                      </div>
                    </button>
                    <button class="action-button delete-button icon-button" (click)="onDeleteRegione(regione.id)">
                      <div class="icon-container">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <polyline points="3,6 5,6 21,6"></polyline>
                          <path d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                        </svg>
                      </div>
                      <div class="text-container">
                        <span>Elimina</span>
                      </div>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </ng-container>

    <ng-template #loadingBlock>
      <div class="loading-container">
        <app-loading-spinner/>
      </div>
    </ng-template>

    <ng-template #noDataBlock>
      <app-empty-state 
        message="Nessuna regione trovata"
        description="Inizia aggiungendo la prima regione al sistema">
      </app-empty-state>
    </ng-template>
  </div>
</div>
