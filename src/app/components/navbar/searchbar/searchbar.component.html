<!-- Search Bar -->
<div class="search-container">
  <input
    type="text"
    class="search-input"
    [placeholder]="placeholder"
    [(ngModel)]="searchQuery"
    (input)="onSearchChange()"
    (keyup.enter)="onSearchSubmit()"
  />
  <button class="search-button" (click)="onSearchSubmit()">
    <svg
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle cx="9" cy="9" r="6" stroke="white" stroke-width="2" />
      <path
        d="M14 14L17 17"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>
</div>
