<!-- navbar.component.html -->
<nav class="navbar-container">
  <div class="navbar-content">
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-circle"><span class="logo-text">LOGO</span></div>
    </div>

    <!-- Dashboard Button (separato) -->
    <div class="dashboard-container">
      <button class="nav-button dashboard-button" routerLink="/" routerLinkActive="nav-button-active" [routerLinkActiveOptions]="{exact: true}">
        Dashboard
      </button>
    </div>

    <!-- Altri Navigation Buttons -->
    <div class="nav-buttons-container">
      <button class="nav-button icon-button" routerLink="/regione" routerLinkActive="nav-button-active">
        <div class="icon-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <div class="text-container">
          <span>Regioni</span>
        </div>
      </button>
      <button class="nav-button icon-button" routerLink="/cliente" routerLinkActive="nav-button-active">
        <div class="icon-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="text-container">
          <span>Clienti</span>
        </div>
      </button>
      <button class="nav-button icon-button" routerLink="/software" routerLinkActive="nav-button-active">
        <div class="icon-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="text-container">
          <span>Software</span>
        </div>
      </button>
      <button class="nav-button icon-button" routerLink="/ambiente" routerLinkActive="nav-button-active">
        <div class="icon-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <div class="text-container">
          <span>Ambienti</span>
        </div>
      </button>
    </div>
    
    <!-- Search Bar -->
    <app-searchbar></app-searchbar>

    <!-- Filter Button -->
    <div class="filter-container">
      <button class="nav-button icon-button filter-button" (click)="openFilterOffcanvas()">
        <div class="icon-container">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="22,3 2,3 10,12.46 10,19 14,21 14,12.46"></polygon>
          </svg>
        </div>
      </button>
    </div>
  </div>
</nav>

<!-- Filter Offcanvas -->
<app-filter-offcanvas 
  [isOpen]="isFilterOffcanvasOpen" 
  (onClose)="closeFilterOffcanvas()">
</app-filter-offcanvas>
