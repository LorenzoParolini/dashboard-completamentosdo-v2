<!-- navbar.component.html -->
<nav class="navbar-container">
  <div class="navbar-content">
    <!-- Logo (senza isoletta) -->
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo" class="logo-image" />
    </div>

    <!-- Isoletta 1: Navigation Buttons -->
    <div class="navbar-island navigation-island">
      <!-- Dashboard Button -->
      <div class="dashboard-container">
        <button
          class="nav-button dashboard-button"
          routerLink="/"
          routerLinkActive="nav-button-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onClickDashboard()"
        >
          Dashboard
        </button>
      </div>

      <!-- Separatore Verticale solo tra Dashboard e altri button -->
      <div class="navbar-separator"></div>

      <!-- Altri Navigation Buttons -->
      <div class="nav-buttons-container">
        <button
          class="nav-button icon-button"
          routerLink="/regione"
          routerLinkActive="nav-button-active"
          (click)="onClickRegione()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div class="text-container">
            <span>Regioni</span>
          </div>
        </button>
        <button
          class="nav-button icon-button"
          routerLink="/cliente"
          routerLinkActive="nav-button-active"
          (click)="onClickCliente()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="text-container">
            <span>Clienti</span>
          </div>
        </button>
        <button
          class="nav-button icon-button"
          routerLink="/software"
          routerLinkActive="nav-button-active"
          (click)="onClickSoftware()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div class="text-container">
            <span>Software</span>
          </div>
        </button>

        <button
          class="nav-button icon-button"
          routerLink="/rilascio"
          routerLinkActive="nav-button-active"
          (click)="onClickRilascio()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3 -5a9 9 0 0 0 6 -8a3 3 0 0 0 -3 -3a9 9 0 0 0 -8 6a6 6 0 0 0 -5 3"
              ></path>
              <path d="M7 14a6 6 0 0 0 -3 6a6 6 0 0 0 6 -3"></path>
              <circle cx="15" cy="9" r="1"></circle>
            </svg>
          </div>
          <div class="text-container">
            <span>Rilasci</span>
          </div>
        </button>
        <button
          class="nav-button icon-button"
          routerLink="/ambiente"
          routerLinkActive="nav-button-active"
          (click)="onClickAmbiente()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <div class="text-container">
            <span>Ambienti</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Isoletta 2: Search e Filtri -->
    <div class="navbar-island search-filters-island">
      <!-- Search Bar -->
      <app-searchbar
        [currentView]="currentView"
        [resetVersion]="filterResetVersion"
      ></app-searchbar>

      <!-- Filter Button -->
      <div class="filter-container">
        <button
          class="nav-button icon-button filter-button"
          (click)="openFilterOffcanvas()"
        >
          <div class="icon-container">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon
                points="22,3 2,3 10,12.46 10,19 14,21 14,12.46"
              ></polygon>
            </svg>
          </div>
        </button>
        <!-- Badge per filtri attivi posizionato sul container -->
        <span class="filter-badge" *ngIf="activeFiltersCount > 0">{{
          activeFiltersCount
        }}</span>
      </div>
    </div>

    <!-- Filter Offcanvas -->
    <app-filter-offcanvas
      [currentView]="currentView"
      [resetVersion]="filterResetVersion"
      [isOpen]="isFilterOffcanvasOpen"
      (onClose)="closeFilterOffcanvas()"
      (onFiltersApplied)="onFiltersApplied($event)"
    >
    </app-filter-offcanvas>
  </div>
</nav>
