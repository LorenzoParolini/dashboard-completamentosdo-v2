<!-- navbar.component.html -->
<nav class="navbar-container">
  <div class="navbar-content">
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-circle"><span class="logo-text">LOGO</span></div>
    </div>
    <!-- Search Bar -->
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Search..."
        [(ngModel)]="searchQuery"
      />
      <button class="search-button">
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="9" cy="9" r="6" stroke="white" stroke-width="2" />
          <path
            d="M14 14L17 17"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>
</nav>
