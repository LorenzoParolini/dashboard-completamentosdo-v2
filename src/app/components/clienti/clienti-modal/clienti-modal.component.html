<div class="clienti-modal-overlay">
  <div class="clienti-modal-container">
    <div class="clienti-modal-header">
      <h2 class="clienti-modal-title">{{ cliente ? 'Modifica Cliente' : 'Aggiungi Cliente' }}</h2>
      <button class="clienti-modal-close" (click)="closeModal()">&times;</button>
    </div>
    <div class="clienti-modal-body">
      <form (ngSubmit)="salva()" class="clienti-modal-form flex-col gap-2">
        <input
          type="text"
          [(ngModel)]="nuovoCliente.descrizione"
          name="descrizione"
          placeholder="Descrizione del cliente"
          class="clienti-modal-input"
          required
        />
        <select 
          [(ngModel)]="nuovoCliente.regione.id"
          (change)="onRegioneChange($event)"
          name="regione"
          class="clienti-modal-input"
          required
        >
          <option value="" *ngIf="!cliente">Seleziona una regione</option>
          <option *ngFor="let regione of regioniDisponibili" [value]="regione.id">
            {{ regione.descrizione }}
          </option>
        </select>
        
        <!-- Selezione Software -->
        <div class="software-selection-container">
          <select
            [(ngModel)]="softwareSelezionatoId"
            name="softwareSelezionato"
            class="clienti-modal-input"
            (change)="onSoftwareSelezionato()"
          >
            <option value="">Seleziona un software da aggiungere</option>
            <option 
              *ngFor="let software of softwareDisponibili" 
              [value]="software.id"
              [disabled]="isSoftwareGiaSelezionato(software.id)"
            >
              {{ software.descrizione }}
              <span *ngIf="isSoftwareGiaSelezionato(software.id)"> (già selezionato)</span>
            </option>
          </select>
          
          <!-- Lista software selezionati -->
          <div class="software-selezionati" *ngIf="nuovoCliente.software.length > 0">
            <label class="software-label">Software selezionati:</label>
            <div class="software-lista">
              <div 
                *ngFor="let software of nuovoCliente.software" 
                class="software-item"
              >
                <span class="software-nome">{{ software.descrizione }}</span>
                <button 
                  type="button" 
                  class="rimuovi-software-btn"
                  (click)="rimuoviSoftware(software.id)"
                  title="Rimuovi software"
                >
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>
        <button type="submit" class="clienti-modal-add-btn mt-2">
          {{ cliente ? 'Salva' : 'Aggiungi' }}
        </button>
      </form>
    </div>
  </div>
</div>
