<div class="software-modal-overlay">
  <div class="software-modal-container">
    <div class="software-modal-header">
      <h2 class="software-modal-title">{{ software ? 'Modifica Software' : 'Aggiungi Software' }}</h2>
      <button class="software-modal-close" (click)="closeModal()">&times;</button>
    </div>
    <div class="software-modal-body">
      <form (ngSubmit)="salva()" class="software-modal-form flex-col gap-2">
        <input
          type="text"
          [(ngModel)]="nuovoSoftware.descrizione"
          name="descrizione"
          placeholder="Descrizione del software"
          class="software-modal-input"
          required
        />
        <textarea
          [(ngModel)]="nuovoSoftware.note"
          name="note"
          placeholder="Note opzionali"
          class="software-modal-input"
          rows="3"
        ></textarea>
        
        <!-- Selezione Ambiente -->
        <div class="ambiente-selection-container">
          <select
            [(ngModel)]="ambienteSelezionatoId"
            name="ambienteSelezionato"
            class="software-modal-input"
            (change)="onAmbienteSelezionato()"
          >
            <option value="">Seleziona un ambiente da aggiungere</option>
            <option 
              *ngFor="let ambiente of ambientiDisponibili" 
              [value]="ambiente.id"
              [disabled]="isAmbienteGiaSelezionato(ambiente.id)"
            >
              {{ ambiente.descrizione }}
              <span *ngIf="isAmbienteGiaSelezionato(ambiente.id)"> (già selezionato)</span>
            </option>
          </select>
          
          <!-- Lista ambienti selezionati -->
          <div class="ambienti-selezionati" *ngIf="nuovoSoftware.ambienti.length > 0">
            <label class="ambienti-label">Ambienti selezionati:</label>
            <div class="ambienti-lista">
              <div 
                *ngFor="let ambiente of nuovoSoftware.ambienti" 
                class="ambiente-item"
              >
                <span class="ambiente-nome">{{ ambiente.descrizione }}</span>
                <button 
                  type="button" 
                  class="rimuovi-ambiente-btn"
                  (click)="rimuoviAmbiente(ambiente.id)"
                  title="Rimuovi ambiente"
                >
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>
        <input
          type="text"
          [(ngModel)]="nuovoSoftware.versioneCorrente"
          name="versioneCorrente"
          placeholder="es. 1.0.0"
          class="software-modal-input"
          required
        />
        <input
          type="date"
          [(ngModel)]="nuovoSoftware.dataUltimoAggiornamento"
          name="dataUltimoAggiornamento"
          class="software-modal-input"
          required
        />
        <button type="submit" class="software-modal-add-btn mt-2">
          {{ software ? 'Salva' : 'Aggiungi' }}
        </button>
      </form>
    </div>
  </div>
</div>
