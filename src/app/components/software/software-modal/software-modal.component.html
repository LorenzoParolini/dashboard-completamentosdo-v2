<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container">
    <!-- Header -->
    <div class="modal-header">
      <div class="modal-title-section">
        <h2 class="modal-title">
          {{ software ? "Modifica Software" : "Aggiungi Software" }}
        </h2>
        <span class="modal-subtitle">{{
          software
            ? "Aggiorna i dati del software"
            : "Inserisci i dati del nuovo software"
        }}</span>
      </div>
      <div class="modal-actions">
        <button
          class="minimize-button"
          (click)="minimizeModal()"
          aria-label="Minimizza modale"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button
          class="close-button"
          (click)="closeModal()"
          aria-label="Chiudi modale"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="modal-content">
      <div class="form-section">
        <div class="section-header">
          <h3 class="section-title">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Informazioni Software
          </h3>
        </div>

        <form (ngSubmit)="salva()" class="form-container">
          <div class="form-grid">
            <div class="form-field form-field-full">
              <label class="form-label">Descrizione Software</label>
              <!--
                Campo con vincoli DTO:
                blur abilita feedback, ngClass colora il bordo,
                field-error mostra il messaggio dedicato.
              -->
              <input
                type="text"
                [(ngModel)]="nuovoSoftware.descrizione"
                name="descrizione"
                placeholder="Inserisci la descrizione del software"
                class="form-input"
                (input)="onFieldChange()"
                (blur)="onFieldBlur('descrizione')"
                [ngClass]="{
                  'field-invalid': isFieldInvalid('descrizione'),
                  'field-valid': isFieldValid('descrizione'),
                }"
                required
              />
              <div class="field-error" *ngIf="isFieldInvalid('descrizione')">
                {{ getDescrizioneError() }}
              </div>
            </div>

            <div class="form-field form-field-full">
              <label class="form-label">Note</label>
              <!-- Note opzionali: feedback visuale quando si supera il limite di lunghezza -->
              <textarea
                [(ngModel)]="nuovoSoftware.note"
                name="note"
                placeholder="Note opzionali sul software"
                class="form-textarea"
                (input)="onFieldChange()"
                (blur)="onFieldBlur('note')"
                [ngClass]="{
                  'field-invalid': isFieldInvalid('note'),
                  'field-valid': isFieldValid('note'),
                }"
                rows="3"
              ></textarea>
              <div class="field-error" *ngIf="isFieldInvalid('note')">
                {{ getNoteError() }}
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="closeModal()">
              Annulla
            </button>
            <button type="submit" class="btn-primary">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                ></path>
                <polyline points="17,21 17,13 7,13 7,21"></polyline>
                <polyline points="7,3 7,8 15,8"></polyline>
              </svg>
              {{ software ? "Salva" : "Aggiungi" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
