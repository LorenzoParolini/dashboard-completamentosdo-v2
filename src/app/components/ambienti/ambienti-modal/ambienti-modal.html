<div class="ambienti-modal-overlay">
  <div class="ambienti-modal-container">
    <div class="ambienti-modal-header">
      <h2 class="ambienti-modal-title">{{ ambiente ? 'Modifica Ambiente' : 'Aggiungi Ambiente' }}</h2>
      <button class="ambienti-modal-close" (click)="closeModal()">&times;</button>
    </div>
    <div class="ambienti-modal-body">
      <form (ngSubmit)="salva()" class="ambienti-modal-form flex-col gap-2">
        <input
          type="text"
          [(ngModel)]="nuovoAmbiente.descrizione"
          name="descrizione"
          placeholder="Descrizione"
          class="ambienti-modal-input"
          required
        />
        <textarea
          [(ngModel)]="nuovoAmbiente.note"
          name="note"
          placeholder="Note opzionali"
          class="ambienti-modal-input"
          rows="3"
        ></textarea>
        <input
          type="date"
          [(ngModel)]="nuovoAmbiente.dataCreazione"
          name="dataCreazione"
          class="ambienti-modal-input"
          required
        />
        <button type="submit" class="ambienti-modal-add-btn mt-2">
          {{ ambiente ? 'Salva' : 'Aggiungi' }}
        </button>
      </form>
    </div>
  </div>
</div>
