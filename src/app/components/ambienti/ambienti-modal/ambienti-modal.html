<div class="modal-header">
  <h4 class="modal-title">{{ ambiente ? 'Modifica Ambiente' : 'Aggiungi Ambiente' }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <form (ngSubmit)="salva()" class="ambienti-modal-form">
    <div class="mb-3">
      <label class="form-label">Descrizione</label>
      <input
        type="text"
        [(ngModel)]="nuovoAmbiente.descrizione"
        name="descrizione"
        placeholder="Descrizione"
        class="form-control"
        required
      />
    </div>
    <div class="mb-3">
      <label class="form-label">Note</label>
      <textarea
        [(ngModel)]="nuovoAmbiente.note"
        name="note"
        placeholder="Note opzionali"
        class="form-control"
        rows="3"
      ></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Data Creazione</label>
      <input
        type="date"
        [(ngModel)]="nuovoAmbiente.dataCreazione"
        name="dataCreazione"
        class="form-control"
        required
      />
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()">Annulla</button>
  <button type="button" class="btn btn-primary" (click)="salva()">
    {{ ambiente ? 'Salva' : 'Aggiungi' }}
  </button>
</div>
