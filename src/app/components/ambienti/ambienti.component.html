<div class="page-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
            ></path>
            <polyline points="3.27,6.96 12,12.01 20.73,6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          Gestione Ambienti
        </h1>
        <p class="page-subtitle">
          Visualizza e gestisci tutti gli ambienti del sistema
        </p>
      </div>
      <button class="add-button icon-button" (click)="openAmbienteModal()">
        <div class="icon-container">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="text-container">
          <span>Aggiungi</span>
        </div>
      </button>
    </div>
  </div>

  <!-- Content Section -->
  <div class="page-content">
    <ng-container *ngIf="!loading; else loadingBlock">
      <app-server-error
        *ngIf="hasError"
        [errorMessage]="errorMessage"
        (retry)="retryLoadAmbienti()"
      >
      </app-server-error>
      <div
        class="data-table-container"
        *ngIf="!hasError && filteredAmbienti.length > 0; else noDataBlock"
      >
        <div class="table-wrapper">
          <table class="data-table">
            <thead class="table-header">
              <tr>
                <th class="table-th">#</th>
                <th class="table-th">Descrizione</th>
                <th class="table-th">Note</th>
                <th class="table-th">Data Creazione</th>
                <th class="table-th">Rilasci</th>
                <th class="table-th actions-column">Azioni</th>
              </tr>
            </thead>
            <tbody class="table-body">
              <tr
                class="table-row"
                *ngFor="let ambiente of filteredAmbienti; let i = index"
              >
                <td class="table-td id-column">{{ i + 1 }}</td>
                <td class="table-td">{{ ambiente.descrizione }}</td>
                <td class="table-td">
                  <span class="note-text" *ngIf="ambiente.note; else noNote">{{
                    ambiente.note
                  }}</span>
                  <ng-template #noNote>
                    <span class="no-data">N/A</span>
                  </ng-template>
                </td>
                <td class="table-td">
                  <span class="date-text">{{
                    ambiente.dataCreazione | date: "dd/MM/yyyy"
                  }}</span>
                </td>
                <td class="table-td">
                  <span class="version-badge">{{
                    (ambiente.rilasci || []).length
                  }}</span>
                </td>
                <td class="table-td actions-column">
                  <div class="action-buttons">
                    <button
                      class="action-button edit-button icon-button"
                      (click)="openAmbienteModal(ambiente)"
                    >
                      <div class="icon-container">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                        >
                          <path
                            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                          ></path>
                          <path
                            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                          ></path>
                        </svg>
                      </div>
                      <div class="text-container">
                        <span>Modifica</span>
                      </div>
                    </button>
                    <button
                      class="action-button delete-button icon-button"
                      (click)="onDeleteAmbiente(ambiente.id)"
                    >
                      <div class="icon-container">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                        >
                          <polyline points="3,6 5,6 21,6"></polyline>
                          <path
                            d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"
                          ></path>
                        </svg>
                      </div>
                      <div class="text-container">
                        <span>Elimina</span>
                      </div>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </ng-container>

    <ng-template #loadingBlock>
      <div class="loading-container">
        <app-loading-spinner />
      </div>
    </ng-template>

    <ng-template #noDataBlock>
      <app-empty-state
        *ngIf="!hasError"
        message="Nessun ambiente trovato"
        description="Inizia aggiungendo il primo ambiente al sistema"
      >
      </app-empty-state>
    </ng-template>
  </div>
</div>
